<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f5f7fb;
      }

      .card {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        width: min(90vw, 420px);
      }

      nav {
        margin-bottom: 16px;
      }

      nav a {
        margin-right: 12px;
        color: #1f6feb;
        text-decoration: none;
      }

      nav a:hover {
        text-decoration: underline;
      }

      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }

      input, textarea {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      button {
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #1f6feb;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #1558b0;
      }

      #confirmation {
        margin-top: 16px;
        font-size: 16px;
        color: #222;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <nav>
        <a href="/">Home</a>
        <a href="/contact.html">Contact Us</a>
      </nav>
      <h1>Contact Us</h1>
      <form id="contactForm">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Submit</button>
      </form>
      <p id="confirmation"></p>
    </main>

    <script>
      const form = document.getElementById("contactForm");
      const confirmation = document.getElementById("confirmation");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        confirmation.textContent = "Thank you for your message!";
      });
    </script>
  </body>
</html>
